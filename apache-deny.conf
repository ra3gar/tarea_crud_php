# Evita que se puedan abrir por el navegador archivos sensibles o internos.
<FilesMatch "^\.">
  Require all denied
</FilesMatch>
<FilesMatch "\.(env|sql|md)$">
  Require all denied
</FilesMatch>
<FilesMatch "^(Dockerfile|docker-compose\.yml|secrets\.php|apache-deny\.conf)$">
  Require all denied
</FilesMatch>
