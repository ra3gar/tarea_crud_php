# =====================================================================
#  docker-compose.yml — Levanta todo el entorno de la tarea.
#  Uso:  docker compose up -d   (desde esta carpeta)
#  Requiere un archivo .env con la variable DB_PASS (ver .env.example).
# =====================================================================
services:

  # --- Base de datos MySQL ---
  mysql_global:
    image: mysql:8.4
    container_name: mysql_global
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: tarea_crud_db
    ports:
      - "3306:3306"
    volumes:
      # Importa la base y la tabla automaticamente la PRIMERA vez que arranca:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql_data:/var/lib/mysql
    networks: [red_proyectos]

  # --- phpMyAdmin (administrar la base por el navegador) ---
  pma_global:
    image: phpmyadmin:latest
    container_name: pma_global
    restart: unless-stopped
    environment:
      PMA_HOST: mysql_global
    ports:
      - "8080:80"
    depends_on: [mysql_global]
    networks: [red_proyectos]

  # --- La aplicacion PHP (se construye desde el Dockerfile) ---
  tarea_crud_web:
    build: .
    container_name: tarea_crud_web
    restart: unless-stopped
    environment:
      DB_HOST: mysql_global
      DB_NAME: tarea_crud_db
      DB_USER: root
      DB_PASS: ${DB_PASS}
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
    depends_on: [mysql_global]
    networks: [red_proyectos]

volumes:
  mysql_data:        # guarda los datos de MySQL entre reinicios

networks:
  red_proyectos:
