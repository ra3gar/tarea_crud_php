# Apache sirve SOLO la carpeta public/ como raiz web. Asi config, secrets y
# la logica de app/ quedan fisicamente fuera del alcance del navegador: no
# por una regla que los niega, sino porque no estan en la carpeta servida.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
